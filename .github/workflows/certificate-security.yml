name: Certificate security regressions

on:
  push:
    branches: [main, master, 'fix/security-*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  certificate-keys:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S test/security -B security-build
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          cmake -S test/security -B security-build -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DCURL_NO_CURL_CMAKE=ON -DCURL_LIBRARY="$SDKROOT/usr/lib/libcurl.tbd" -DCURL_INCLUDE_DIR="$SDKROOT/usr/include"
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows "curl[core,openssl]:x64-windows" --classic
          cmake -S test/security -B security-build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=x64-windows
      - run: cmake --build security-build --config Release
      - run: ctest --test-dir security-build -C Release --output-on-failure
